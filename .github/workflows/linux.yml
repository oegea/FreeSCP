# Builds, tests and packages FreeSCP for Linux (x86-64 and ARM64) as AppImages.
#
#  - every push to a `ci-*` branch and every manual run: build + tests, AppImages kept as artifacts
#  - a `v*` tag (or a manual run with `release_tag`): additionally attaches the AppImages to that
#    GitHub release (the release must already exist; a draft is fine)
#
# Built on Ubuntu 22.04 so the result runs on glibc 2.35+ (Ubuntu 22.04, Debian 12, Fedora 36, ...).
name: Linux

on:
  workflow_dispatch:
    inputs:
      release_tag:
        description: "Attach the AppImages to this existing release tag (optional)"
        required: false
  push:
    branches: ["ci-*"]
    tags: ["v*"]

permissions:
  contents: write

jobs:
  appimage:
    name: AppImage (${{ matrix.arch }})
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - { arch: x86_64,  runner: ubuntu-22.04 }
          - { arch: aarch64, runner: ubuntu-22.04-arm }
    env:
      LANG: C.UTF-8
      LC_ALL: C.UTF-8
    steps:
      - uses: actions/checkout@v4

      - name: Install build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            clang lld cmake ninja-build python3 qt6-base-dev libqt6svg6-dev qt6-qpa-plugins libssl-dev \
            nasm autoconf automake libtool pkg-config zlib1g-dev libgl1-mesa-dev \
            openssh-server xvfb file desktop-file-utils libxkbcommon-x11-0 libxcb-cursor0 \
            libxcb-icccm4 libxcb-image0 libxcb-keysyms1 libxcb-randr0 libxcb-render-util0 libxcb-shape0

      - name: Build
        run: native/scripts/build-linux.sh Release

      - name: Unit tests
        run: ctest --test-dir native/build-linux --output-on-failure

      - name: Start a local SSH server for the end-to-end tests
        run: |
          # empty skeleton: the runner image's default dotfiles print at login, which breaks SFTP/SCP
          sudo useradd -m -k /dev/null -s /bin/bash winscp
          echo 'winscp:winscp123' | sudo chpasswd
          sudo mkdir -p /run/sshd
          sudo /usr/sbin/sshd -p 2222 -o PasswordAuthentication=yes -o KbdInteractiveAuthentication=no \
            -o UsePAM=yes -o AllowUsers=winscp
          sudo -u winscp sh -c 'cd ~ && echo hello > hello.txt && mkdir -p testdir && echo n > testdir/nested.txt'

      - name: End-to-end tests (engine, SFTP + SCP)
        run: native/scripts/e2e-ssh.sh native/build-linux 127.0.0.1 2222 winscp winscp123

      - name: Backtrace (only if the end-to-end tests failed)
        if: failure()
        run: |
          sudo apt-get install -y --no-install-recommends gdb >/dev/null
          gdb -batch -ex run -ex bt -ex 'info registers pc' --args native/build-linux/harness/winscp-harness 127.0.0.1 2222 winscp winscp123 2>&1 | tail -40

      - name: Package AppImage
        run: |
          curl -fL --retry 3 -o /tmp/appimagetool \
            "https://github.com/AppImage/appimagetool/releases/download/continuous/appimagetool-${{ matrix.arch }}.AppImage"
          chmod +x /tmp/appimagetool
          printf '#!/bin/sh\nexec /tmp/appimagetool --appimage-extract-and-run "$@"\n' | sudo tee /usr/local/bin/appimagetool >/dev/null
          sudo chmod +x /usr/local/bin/appimagetool
          native/scripts/package-linux.sh
          ls -la FreeSCP-Linux-${{ matrix.arch }}.AppImage

      - name: Smoke-test the AppImage itself (bundled Qt, real X server)
        run: |
          chmod +x FreeSCP-Linux-${{ matrix.arch }}.AppImage
          rm -rf /tmp/dlq
          xvfb-run -a env WINSCP_SHOT=/tmp/appimage.png \
            WINSCP_AUTOCONNECT=127.0.0.1:2222:winscp:winscp123:sftp WINSCP_AUTOXFER=hello.txt,testdir \
            ./FreeSCP-Linux-${{ matrix.arch }}.AppImage --appimage-extract-and-run
          test -s /tmp/appimage.png
          test "$(cat /tmp/dlq/hello.txt)" = hello
          test "$(cat /tmp/dlq/testdir/nested.txt)" = n

      - uses: actions/upload-artifact@v4
        with:
          name: FreeSCP-Linux-${{ matrix.arch }}
          path: |
            FreeSCP-Linux-${{ matrix.arch }}.AppImage
            /tmp/appimage.png
          if-no-files-found: error

      - name: Attach to the release
        if: startsWith(github.ref, 'refs/tags/v') || inputs.release_tag != ''
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ inputs.release_tag != '' && inputs.release_tag || github.ref_name }}
        run: gh release upload "$TAG" FreeSCP-Linux-${{ matrix.arch }}.AppImage --clobber
